
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5fa;
}

/* Main page */
.main-content {
    text-align: center;
    padding: 80px 20px;
}

.main-content h1 {
    color: #263b78;
}

/* Floating chatbot button */
.chatbot-button {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 65px;
    height: 65px;
    border: none;
    border-radius: 50%;
    background: #3158c9;
    color: white;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 15px #0003;
    z-index: 1000;
}

.chatbot-button:hover {
    background: #2343a3;
}

/* Chatbot window */
.chatbot-window {
    display: none;
    position: fixed;
    bottom: 100px;
    right: 25px;
    width: 370px;
    height: 520px;
    max-height: calc(100dvh - 120px);
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 25px #0003;
    overflow: hidden;
    flex-direction: column;
    z-index: 1000;
}

.chatbot-window.open {
    display: flex;
}

/* Header */
.chatbot-header {
    background: #263b78;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.chatbot-header h3 {
    margin: 0;
    font-size: 17px;
}

.close-btn {
    background: transparent;
    color: white;
    border: none;
    font-size: 23px;
    cursor: pointer;
}

/* Document information */
.document-status {
    padding: 10px;
    background: #eef2ff;
    color: #445;
    font-size: 12px;
    border-bottom: 1px solid #ddd;
    overflow-wrap: anywhere;
}

/* Chat messages */
.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 85%;
    padding: 11px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #3158c9;
    color: white;
    align-self: flex-end;
}

.bot {
    background: #eef0f5;
    color: #222;
    align-self: flex-start;
}

.source {
    font-size: 11px;
    color: #667;
    margin-top: 7px;
}

/* Bottom input section */
.chat-footer {
    border-top: 1px solid #ddd;
    padding: 10px;
    background: white;
}

/* File upload row */
.upload-section {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
}

.upload-label {
    background: #edf1ff;
    color: #3158c9;
    border-radius: 8px;
    padding: 9px 12px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
}

.upload-label:hover {
    background: #dce5ff;
}

#fileName {
    font-size: 12px;
    color: #666;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.upload-btn {
    background: #3158c9;
    color: white;
    border: 0;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* Chat input */
.input-row {
    display: flex;
    gap: 8px;
}

.input-row input {
    flex: 1;
    min-width: 0;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
}

.send-btn {
    background: #3158c9;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* Mobile */
@media(max-width: 500px) {
    .chatbot-window {
        right: 10px;
        bottom: 90px;
        width: calc(100% - 20px);
        height: min(520px, calc(100dvh - 110px));
    }

    .chatbot-button {
        right: 15px;
        bottom: 15px;
    }
}
</style>
</head>

<body>

<!-- Main website -->
<div class="main-content">
    <h1>Welcome to RAG Application</h1>
    <p>Ask questions based on your documents.</p>
    <p>Click the chatbot icon in the bottom-right corner.</p>
</div>

<!-- Floating chatbot button -->
<button
    class="chatbot-button"
    id="chatbotToggle"
    onclick="toggleChatbot()"
    aria-label="Open chatbot"
>
    💬
</button>

<!-- Chatbot window -->
<div class="chatbot-window" id="chatbotWindow">

    <!-- Header -->
    <div class="chatbot-header">
        <h3>🤖 RAG Chatbot</h3>

        <button class="close-btn"
                onclick="toggleChatbot()"
                aria-label="Close chatbot">
            &times;
        </button>
    </div>

    <!-- Active document -->
    <div class="document-status" id="documentStatus">
        No document uploaded
    </div>

    <!-- Chat messages -->
    <div class="chat-box" id="chatBox">

        <div class="message bot">
Hello! 👋

Upload your document and ask me questions.

Supported files: PDF, DOCX, TXT.
        </div>

    </div>

    <!-- Footer -->
    <div class="chat-footer">

        <!-- Upload inside chatbot -->
        <div class="upload-section">

            <label for="documentFile" class="upload-label">
                📎 File
            </label>

            <input
                type="file"
                id="documentFile"
                accept=".pdf,.docx,.txt"
                hidden
                onchange="showFileName()"
            >

            <span id="fileName">No file selected</span>

            <button
                class="upload-btn"
                id="uploadBtn"
                onclick="uploadDocument()">
                Upload
            </button>

        </div>

        <!-- Question input -->
        <div class="input-row">

            <input
                type="text"
                id="question"
                placeholder="Ask about your document..."
                onkeydown="if(event.key==='Enter') sendMessage()"
            >

            <button
                class="send-btn"
                id="sendBtn"
                onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>

<script>

const chatbotWindow = document.getElementById("chatbotWindow");
const chatBox = document.getElementById("chatBox");
const statusBox = document.getElementById("documentStatus");

// Open and close chatbot
function toggleChatbot() {
    chatbotWindow.classList.toggle("open");
}

// Display selected filename
function showFileName() {
    const file = document.getElementById("documentFile").files[0];

    document.getElementById("fileName").textContent =
        file ? file.name : "No file selected";
}

// Display chat message
function addMessage(text, type, source = "") {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    if (source) {
        const small = document.createElement("div");
        small.className = "source";
        small.textContent = "Source: " + source;
        div.appendChild(small);
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Handle API responses
async function readResponse(response) {

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("Invalid server response");
    }

    if (!response.ok) {
        throw new Error(data.detail || "Request failed");
    }

    return data;
}

// Get active document
async function loadDocument() {

    try {
        const response = await fetch("/document");
        const data = await readResponse(response);

        if (data.uploaded) {
            statusBox.textContent =
                "📄 " + data.filename +
                " | Chunks: " + data.total_chunks;
        } else {
            statusBox.textContent = "No document uploaded";
        }

    } catch (error) {
        statusBox.textContent = error.message;
    }
}

// Upload or replace document
async function uploadDocument() {

    const fileInput = document.getElementById("documentFile");
    const uploadBtn = document.getElementById("uploadBtn");
    const file = fileInput.files[0];

    if (!file) {
        alert("Please choose a document first");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    uploadBtn.disabled = true;
    statusBox.textContent = "Processing document...";

    try {

        const response = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await readResponse(response);

        // Clear old conversation after replacing document
        chatBox.innerHTML = "";

        addMessage(
            "✅ Document uploaded successfully!\n\n" +
            "File: " + data.filename +
            "\nChunks: " + data.total_chunks +
            "\n\nAsk me questions about this document.",
            "bot"
        );

        fileInput.value = "";
        showFileName();

    } catch (error) {

        addMessage(
            "Upload failed: " + error.message,
            "bot"
        );

    } finally {
        uploadBtn.disabled = false;
        await loadDocument();
    }
}

// Send question to RAG API
async function sendMessage() {

    const input = document.getElementById("question");
    const sendBtn = document.getElementById("sendBtn");

    const question = input.value.trim();

    if (!question || sendBtn.disabled) return;

    addMessage(question, "user");
    input.value = "";

    sendBtn.disabled = true;
    input.disabled = true;

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await readResponse(response);

        addMessage(
            data.answer,
            "bot",
            data.source
        );

    } catch (error) {

        addMessage(
            "Error: " + error.message,
            "bot"
        );

    } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
    }
}

// Load existing document on startup
loadDocument();

</script>

</body>
</html>
